<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Activar modo claro"
      >
        <span aria-hidden="true">🌙</span>
      </button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <select id="skin-select" aria-label="Tema visual"></select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <section class="screen" data-screen="start" hidden>
          <p class="screen-title">TETRIS</p>
          <div id="start-records" class="records"></div>
          <label class="start-level-field">
            <span>Nivel inicial</span>
            <select id="start-level"></select>
          </label>
          <label class="start-level-field">
            <span>Skin</span>
            <select id="skin-select-start"></select>
          </label>
          <button id="play-btn" type="button">JUGAR</button>
          <button id="reset-records-btn" type="button" class="btn-secondary">Borrar records</button>
        </section>

        <section class="screen" data-screen="pause" hidden>
          <p class="screen-title">PAUSA</p>
          <div class="menu-buttons">
            <button id="resume-btn" type="button">Reanudar</button>
            <button id="pause-restart-btn" type="button">Reiniciar</button>
            <button id="show-controls-btn" type="button">Ver controles</button>
          </div>
          <label class="start-level-field">
            <span>Nivel inicial (próxima partida)</span>
            <select id="start-level-pause"></select>
          </label>
          <div id="pause-records" class="records"></div>
        </section>

        <section class="screen" data-screen="pause-controls" hidden>
          <p class="screen-title">CONTROLES</p>
          <ul class="menu-controls">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída dura</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
          <button id="controls-back-btn" type="button">Volver</button>
        </section>

        <section class="screen" data-screen="gameover" hidden>
          <p id="overlay-title" class="screen-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="name-entry" hidden>
            <p class="name-entry-hint">¡Entras en el top 5!</p>
            <input id="player-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="save-score-btn" type="button">Guardar</button>
          </div>
          <div id="gameover-records" class="records"></div>
          <button id="restart-btn">Reiniciar</button>
        </section>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
